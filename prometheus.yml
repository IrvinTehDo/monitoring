global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'nodeexporter'
    static_configs:
      - targets: ['nodeexporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
      
  - job_name: 'plex'
    static_configs:
        - targets: ['localhost:1900', 'localhost:32410', 'localhost:32412', 'localhost:32413', 'localhost:32414', 'localhost:32469', 'localhost:8324', 'localhost:3005', 'localhost:32400']
        
  - job_name: 'portainer'
    static_configs:
        - targets: ['localhost:8000', 'localhost:9443']